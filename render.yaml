services:
  - type: web
    name: instawatch-free
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python main.py
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"

      - key: PLAYWRIGHT_SKIP_BROWSER_GC
        value: "1"

      - key: DISCORD_TOKEN
        sync: false

      - key: ADMIN_USER_ID
        sync: false

      - key: OWNER_GUILD_ID
        sync: false

      - key: CHECK_INTERVAL_SECONDS
        value: "15"

      - key: DATABASE_PATH
        value: "instawatch.db"

      - key: SCREENSHOT_ENABLED
        value: "true"

      - key: INSTAGRAM_TIMEOUT_SECONDS
        value: "30"